# Genera las salidas de los próximos días y actualiza sus estados en la base de producción.
# Hace lo mismo que el cron del servidor cuando no hay un servidor propio (Render gratis no tiene cron).
# Requiere el secreto DATABASE_URL en Settings → Secrets and variables → Actions.
name: Salidas diarias

on:
  schedule:
    - cron: "0 8 * * *" # 08:00 UTC = 04:00 en Bolivia
  workflow_dispatch:

jobs:
  salidas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Generar salidas
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Falta el secreto DATABASE_URL; no hay nada que hacer."
            exit 0
          fi
          python -m seeds.run_seeds --solo-salidas
